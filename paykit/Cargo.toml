[workspace]
members = ["."]
resolver = "2"

[package]
name = "polar-paykit"
default-run = "polar-paykit"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bitcoin = "0.32"
lightning-invoice = { version = "0.34", features = ["std"] }
chrono = "0.4"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
chacha20poly1305 = "0.10"
ciborium = "0.2"
fs2 = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
paykit-sdk = { git = "https://github.com/pubky/paykit-rs", rev = "5ef8caf8d9a812f571a954fd3b7afe5ef22fd10f" }
paykit-lib = { git = "https://github.com/pubky/paykit-rs", rev = "5ef8caf8d9a812f571a954fd3b7afe5ef22fd10f" }
pubky = "=0.11.0"
pubky-testnet = "=0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
