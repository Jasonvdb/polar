name: CI

on:
  push:
    branches:
      - 'master'
      - 'ci/*'
      - 'codex/flow-vibe-*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Run always on push, or on pull requests that are not from release or ci branches. This prevents duplicate runs.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'ci/'))

    strategy:
      matrix:
        node_version: [20.x]
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: ubuntu file watcher tweak
        if: matrix.os == 'ubuntu-latest'
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p

      - uses: actions/checkout@v6.0.3

      - name: setup nodejs
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: yarn

      - name: install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: lint code
        run: yarn lint

      - name: typescript compile
        run: yarn tsc

      - name: unit tests
        run: yarn test:ci

      - name: build check
        if: startsWith(github.ref_name, 'release/') == false
        run: yarn build

      - name: isolation regression tests
        run: yarn test:isolation

      - name: install Linux Electron runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libatk-bridge2.0-0t64 libxss1 xvfb xauth
          ldd "$(node -p "require('electron')")" | tee "$RUNNER_TEMP/paykit-electron-libraries.log"
          if grep -q 'not found' "$RUNNER_TEMP/paykit-electron-libraries.log"; then exit 1; fi

      - name: isolated Electron UI tests
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          DEBUG: 'testcafe:browser-provider-electron:*'
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_ENABLE_STACK_DUMPING: '1'
          POLAR_PAYKIT_E2E_ROOT: ${{ runner.temp }}/paykit-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          POLAR_PAYKIT_INSTANCE: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$POLAR_PAYKIT_E2E_ROOT"
          set -o pipefail
          xvfb-run --auto-servernum yarn test:cafe 2>&1 | tee "$RUNNER_TEMP/paykit-electron-ui.log"

      - name: retain Linux Electron diagnostics
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: polar-paykit-linux-ui-diagnostics
          path: |
            ${{ runner.temp }}/paykit-electron-libraries.log
            ${{ runner.temp }}/paykit-electron-ui.log
          if-no-files-found: warn
